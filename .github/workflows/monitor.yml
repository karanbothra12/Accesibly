name: Internet monitoring tick

# NOTE: the scheduled tick is DISABLED — the monitoring loop now runs continuously
# on the always-on worker (Railway/Oracle). Two central runners would share agent #1
# and flap its location label, so the 5-min cron is turned off here. Re-enable the
# `schedule:` block below only if you drop the always-on worker.
on:
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch: {}   # still runnable manually from the Actions tab if needed

concurrency:
  group: monitor-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # --ignore-scripts skips Playwright's browser download (monitoring uses plain
      # Node HTTP, no Chromium) — keeps the job fast.
      - run: npm ci --ignore-scripts
      - run: npx tsx worker/monitor-tick.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          AUDIT_USER_AGENT: 'AccesslyMonitorBot/1.0 (+https://accessly.io/bot)'
          NODE_ENV: production
